output:
  assembly-versioning-scheme: MajorMinorPatch
calculation:
  # "ContinuousDelivery" is what GitVersion 5 called "ContinuousDeployment" (a prerelease that
  # increments per commit), which is the behaviour the NUKE build produced when it pinned
  # GitVersion.Tool to 5.12.0. Without it, untagged main commits are stamped as stable.
  mode: ContinuousDelivery
  branches:
    # The key must be `main`: an unrecognised key is silently ignored along with its `label`.
    # Untagged commits on main are prereleases (for example 0.x.y-ci.N); pushing a v* tag
    # produces the stable release.
    main:
      regex: ^main$|^master$
      label: ci
  ignore:
    sha: []
