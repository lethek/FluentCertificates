version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # These two are pinned to a major version per target framework in <Choose> blocks in the csproj
    # files (8.x for net8.0, 10.x otherwise). Dependabot rewrites every occurrence of a package in a file
    # to one version, so any bump, even a patch, moves the net8.0 branch onto 10.x. Bump them by hand.
    ignore:
      - dependency-name: "System.Collections.Immutable"
      - dependency-name: "System.Security.Cryptography.Pkcs"
      # Version 11 depends on System.IO.Hashing 11, which warns on every net8.0 and net9.0 build
      - dependency-name: "Microsoft.SourceLink.GitHub"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
