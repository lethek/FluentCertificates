version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # These two are pinned to a major version per target framework in <Choose> blocks in the csproj
    # files (8.x for net8.0, 10.x otherwise). A major bump would break the net8.0 branch.
    ignore:
      - dependency-name: "System.Collections.Immutable"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
